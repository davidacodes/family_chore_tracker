[project]
name = "family-chore-tracker"
version = "0.1.0"
description = "A shared-screen family chore tracker and scheduler."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
