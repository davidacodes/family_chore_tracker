{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Family Chore Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="https://unpkg.com/htmx.org@2.0.7" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-title" href="{% url 'chores:home' %}">Family Chore Tracker</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="{% url 'chores:setup_kids' %}">Setup</a>
            </nav>
        </div>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
