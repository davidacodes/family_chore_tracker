<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Family Chore Tracker</title>
</head>
<body>
    <main>
        <h1>Family Chore Tracker</h1>

        <section aria-labelledby="calendar-heading">
            <h2 id="calendar-heading">Weekly Calendar</h2>
            <p>
                <time datetime="{{ week_start|date:'Y-m-d' }}">{{ week_start|date:"M j, Y" }}</time>
                to
                <time datetime="{{ week_end|date:'Y-m-d' }}">{{ week_end|date:"M j, Y" }}</time>
            </p>

            <nav aria-label="Week navigation">
                <a href="?week={{ previous_week }}">Previous week</a>
                <a href="?week={{ current_week }}">Current week</a>
                <a href="?week={{ next_week }}">Next week</a>
            </nav>

            <ol aria-label="Days in selected week">
                {% for day in week %}
                    <li>
                        <time datetime="{{ day|date:'Y-m-d' }}">{{ day|date:"l, M j" }}</time>
                    </li>
                {% endfor %}
            </ol>
        </section>
    </main>
</body>
</html>
