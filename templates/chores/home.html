{% extends "base.html" %}

{% block content %}
<section class="week-overview" aria-labelledby="calendar-heading">
    <div class="week-overview__header">
        <div>
            <h1 id="calendar-heading">Weekly Calendar</h1>
            <p class="week-range">
                <time datetime="{{ week_start|date:'Y-m-d' }}">{{ week_start|date:"M j, Y" }}</time>
                <span>to</span>
                <time datetime="{{ week_end|date:'Y-m-d' }}">{{ week_end|date:"M j, Y" }}</time>
            </p>
        </div>

        <nav class="week-nav" aria-label="Week navigation">
            <a href="?week={{ previous_week }}">Previous week</a>
            <a href="?week={{ current_week }}">Current week</a>
            <a href="?week={{ next_week }}">Next week</a>
        </nav>
    </div>

    <ol class="day-list" aria-label="Days in selected week">
        {% for day in week %}
            <li class="day-list__item">
                <time datetime="{{ day|date:'Y-m-d' }}">{{ day|date:"l, M j" }}</time>
            </li>
        {% endfor %}
    </ol>
</section>
{% endblock %}
